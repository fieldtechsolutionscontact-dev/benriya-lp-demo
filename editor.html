<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像アップロード対応・リアルタイムLP生成エディタ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f1f5f9;
      color: #1e293b;
    }

    /* 左側：設定フォームパネル */
    #editor-pane {
      width: 440px;
      min-width: 440px;
      background: #ffffff;
      border-right: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
      z-index: 10;
    }
    #editor-header {
      padding: 16px 20px;
      background: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #editor-form {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .form-section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      margin: 18px 0 10px;
      padding-bottom: 4px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-section-title:first-child { margin-top: 0; }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #334155;
    }
    .form-group input[type="text"],
    .form-group textarea,
    .form-group input[type="file"] {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #0f172a;
      background: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input[type="file"] {
      padding: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .form-group textarea {
      resize: vertical;
      height: 60px;
      line-height: 1.5;
    }

    /* テーマカラー選択ボタン */
    .color-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .color-btn-label input { display: none; }
    .color-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 4px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }
    .dot-orange { background: #f28b30; }
    .dot-blue { background: #2563eb; }
    .dot-green { background: #059669; }

    .color-btn-label input:checked + .color-btn {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1e40af;
    }

    .row-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .row-group input:first-child { flex: 2; }
    .row-group input:last-child { flex: 1; }

    .card-inputs {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .card-inputs-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 8px;
    }

    /* 保存ボタン */
    .action-area {
      margin-top: 24px;
      margin-bottom: 10px;
    }
    .btn-download {
      width: 100%;
      padding: 15px;
      background: #059669;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(5,150,105,0.25);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-download:hover { background: #047857; }
    .btn-download:active { transform: scale(0.99); }

    /* 右側：リアルタイムプレビュー枠 */
    #preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #cbd5e1;
      height: 100vh;
    }
    #preview-header {
      padding: 12px 24px;
      background: #ffffff;
      border-bottom: 1px solid #cbd5e1;
      font-size: 0.85rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.78rem;
    }
    #preview-frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    @media (max-width: 850px) {
      body { flex-direction: column; height: auto; overflow: auto; }
      #editor-pane { width: 100%; min-width: 100%; height: auto; }
      #preview-pane { height: 750px; }
    }
  </style>
</head>
<body>

  <!-- 左ペイン：設定フォーム -->
  <div id="editor-pane">
    <div id="editor-header">
      <span>LP生成エディタ（画像対応）</span>
      <span style="font-size:0.75rem; font-weight:normal; opacity:0.8;">リアルタイム自動連動</span>
    </div>
    <div id="editor-form">

      <!-- 1. 基本情報 -->
      <div class="form-section-title">1. 基本情報設定</div>
      <div class="form-group">
        <label>屋号・店舗名</label>
        <input type="text" id="shopName" value="街のまごころ便利屋">
      </div>
      <div class="form-group">
        <label>メインキャッチコピー（改行可）</label>
        <textarea id="mainCatch">お部屋の「困った」を&#10;笑顔と安心で即解決</textarea>
      </div>
      <div class="form-group">
        <label>サブ説明文</label>
        <textarea id="subCatch">「知らない人を家にあげるのが不安…」「料金の不透明さが心配…」そんなお悩みに寄り添う、女性・シニア層に優しい地域密着サービスです。</textarea>
      </div>

      <!-- 2. 連絡先 -->
      <div class="form-section-title">2. 連絡先・誘導先設定</div>
      <div class="form-group">
        <label>電話番号</label>
        <input type="text" id="telNum" value="0120-000-000">
      </div>
      <div class="form-group">
        <label>LINE公式アカウントURL</label>
        <input type="text" id="lineUrl" value="https://line.me">
      </div>

      <!-- 3. デザインテーマ -->
      <div class="form-section-title">3. テーマカラー選択</div>
      <div class="form-group">
        <div class="color-options">
          <label class="color-btn-label">
            <input type="radio" name="themeColor" value="orange" checked>
            <div class="color-btn">
              <div class="color-dot dot-orange"></div>
              <span>温かみオレンジ</span>
            </div>
          </label>
          <label class="color-btn-label">
            <input type="radio" name="themeColor" value="blue">
            <div class="color-btn">
              <div class="color-dot dot-blue"></div>
              <span>信頼ブルー</span>
            </div>
          </label>
          <label class="color-btn-label">
            <input type="radio" name="themeColor" value="green">
            <div class="color-btn">
              <div class="color-dot dot-green"></div>
              <span>清潔グリーン</span>
            </div>
          </label>
        </div>
      </div>

      <!-- 4. スタッフ紹介 -->
      <div class="form-section-title">4. スタッフ紹介設定</div>
      <div class="form-group">
        <label>スタッフ顔写真を選択</label>
        <input type="file" id="staffImgFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>スタッフ肩書・お名前</label>
        <input type="text" id="staffName" value="店長・女性スタッフ一同">
      </div>
      <div class="form-group">
        <label>一言メッセージ</label>
        <textarea id="staffMsg">身だしなみのチェック、靴下の履き替え、丁寧な言葉遣いと笑顔でのご対応を徹底しております。男性スタッフだけのご訪問が不安な女性やシニアの方も、どうぞ安心してお任せください。</textarea>
      </div>

      <!-- 5. 料金メニュー -->
      <div class="form-section-title">5. 料金メニュー設定（最大5件）</div>
      <div class="form-group">
        <div class="row-group">
          <input type="text" id="menu1_name" value="家具の移動・組み立て" placeholder="サービス名 1">
          <input type="text" id="menu1_price" value="3,300円〜" placeholder="金額">
        </div>
        <div class="row-group">
          <input type="text" id="menu2_name" value="電球交換・高所作業" placeholder="サービス名 2">
          <input type="text" id="menu2_price" value="2,200円〜" placeholder="金額">
        </div>
        <div class="row-group">
          <input type="text" id="menu3_name" value="不用品のお片付け支援" placeholder="サービス名 3">
          <input type="text" id="menu3_price" value="5,500円〜" placeholder="金額">
        </div>
        <div class="row-group">
          <input type="text" id="menu4_name" value="お庭の草むしり・軽作業" placeholder="サービス名 4">
          <input type="text" id="menu4_price" value="4,400円〜" placeholder="金額">
        </div>
        <div class="row-group">
          <input type="text" id="menu5_name" value="水回りの簡単クリーニング" placeholder="サービス名 5">
          <input type="text" id="menu5_price" value="6,600円〜" placeholder="金額">
        </div>
      </div>

      <!-- 6. ビフォーアフター -->
      <div class="form-section-title">6. 作業実績・ビフォーアフター設定（2件）</div>
      <div class="card-inputs">
        <div class="card-inputs-title">【事例 1】</div>
        <div class="form-group">
          <label>Before写真選択</label>
          <input type="file" id="ba1_beforeFile" accept="image/*">
        </div>
        <div class="form-group">
          <label>After写真選択</label>
          <input type="file" id="ba1_afterFile" accept="image/*">
        </div>
        <div class="form-group">
          <label>作業タイトル</label>
          <input type="text" id="ba1_title" value="不用品お片付け・お部屋整理">
        </div>
        <div class="form-group">
          <label>解説文</label>
          <textarea id="ba1_desc">散らかっていたお部屋も、作業時間約2時間ですっきり元通り。不用品の分別から搬出まで全て対応いたしました。</textarea>
        </div>
        <div class="row-group">
          <input type="text" id="ba1_time" value="作業時間：約2時間">
          <input type="text" id="ba1_cost" value="費用：16,500円">
        </div>
      </div>

      <div class="card-inputs">
        <div class="card-inputs-title">【事例 2】</div>
        <div class="form-group">
          <label>Before写真選択</label>
          <input type="file" id="ba2_beforeFile" accept="image/*">
        </div>
        <div class="form-group">
          <label>After写真選択</label>
          <input type="file" id="ba2_afterFile" accept="image/*">
        </div>
        <div class="form-group">
          <label>作業タイトル</label>
          <input type="text" id="ba2_title" value="水回り清掃・キッチンクリーニング">
        </div>
        <div class="form-group">
          <label>解説文</label>
          <textarea id="ba2_desc">長年の油汚れや焦げ付きも、専用洗剤とプロの技術でピカピカに。清潔感のある明るいキッチンを取り戻しました。</textarea>
        </div>
        <div class="row-group">
          <input type="text" id="ba2_time" value="作業時間：約1.5時間">
          <input type="text" id="ba2_cost" value="費用：9,900円">
        </div>
      </div>

      <!-- 7. お客様の声 -->
      <div class="form-section-title">7. お客様の声設定（3件）</div>
      <div class="card-inputs">
        <div class="card-inputs-title">【声 1】</div>
        <div class="row-group">
          <input type="text" id="v1_badge" value="20代女性 / 一人暮らし">
          <input type="text" id="v1_title" value="不用品処分">
        </div>
        <textarea id="v1_text">「男性スタッフだけだと不安でしたが、女性スタッフさんが笑顔で同行してくれて安心して任せられました。」</textarea>
      </div>

      <div class="card-inputs">
        <div class="card-inputs-title">【声 2】</div>
        <div class="row-group">
          <input type="text" id="v2_badge" value="30代女性 / 主婦">
          <input type="text" id="v2_title" value="家具組み立て">
        </div>
        <textarea id="v2_text">「LINEで写真を送った段階で正確な金額を教えてもらい、当日の追加料金も一切ありませんでした。」</textarea>
      </div>

      <div class="card-inputs">
        <div class="card-inputs-title">【声 3】</div>
        <div class="row-group">
          <input type="text" id="v3_badge" value="60代女性 / シニア">
          <input type="text" id="v3_title" value="草むしり・電球交換">
        </div>
        <textarea id="v3_text">「電話対応がとても丁寧で、重いゴミ袋も全部運んでくれて本当に助かりました。」</textarea>
      </div>

      <!-- 出力ボタン -->
      <div class="action-area">
        <button class="btn-download" onclick="downloadLP()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          自店用LP（HTML）を保存する
        </button>
      </div>

    </div>
  </div>

  <!-- 右ペイン：リアルタイムプレビュー -->
  <div id="preview-pane">
    <div id="preview-header">
      <span class="preview-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        リアルタイムプレビュー中
      </span>
      <span>※文字や画像の変更が即座に反映されます</span>
    </div>
    <iframe id="preview-frame"></iframe>
  </div>

  <script>
    // Base64画像保持用変数
    let staffImgBase64 = '';
    let ba1_beforeBase64 = '';
    let ba1_afterBase64 = '';
    let ba2_beforeBase64 = '';
    let ba2_afterBase64 = '';

    // テーマカラーパレット定義
    const colorPalettes = {
      orange: {
        primary: '#f28b30',
        primaryDark: '#d97016',
        primaryLight: '#fff3e6',
        bgBase: '#fff8f0'
      },
      blue: {
        primary: '#2563eb',
        primaryDark: '#1d4ed8',
        primaryLight: '#eff6ff',
        bgBase: '#f4f8ff'
      },
      green: {
        primary: '#059669',
        primaryDark: '#047857',
        primaryLight: '#ecfdf5',
        bgBase: '#f2fcf7'
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatText(str) {
      return escapeHtml(str).replace(/\n/g, '<br>');
    }

    // ファイル選択時のBase64読み込み処理
    function handleFileSelect(inputId, callback) {
      const el = document.getElementById(inputId);
      if (!el) return;
      el.addEventListener('change', function(e) {
        const file = e.target.files;
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            callback(evt.target.result);
            updatePreview();
          };
          reader.readAsDataURL(file);
        }
      });
    }

    // 各ファイルインプットのバインド
    handleFileSelect('staffImgFile', data => { staffImgBase64 = data; });
    handleFileSelect('ba1_beforeFile', data => { ba1_beforeBase64 = data; });
    handleFileSelect('ba1_afterFile', data => { ba1_afterBase64 = data; });
    handleFileSelect('ba2_beforeFile', data => { ba2_beforeBase64 = data; });
    handleFileSelect('ba2_afterFile', data => { ba2_afterBase64 = data; });

    // 完成版HTML文字列の生成
    function generateLP() {
      const name = escapeHtml(document.getElementById('shopName').value.trim() || '街のまごころ便利屋');
      const mainCatch = formatText(document.getElementById('mainCatch').value.trim() || 'お部屋の「困った」を\n笑顔と安心で即解決');
      const subCatch = escapeHtml(document.getElementById('subCatch').value.trim() || '「知らない人を家にあげるのが不安…」「料金の不透明さが心配…」そんなお悩みに寄り添う、女性・シニア層に優しい地域密着サービスです。');
      const tel = escapeHtml(document.getElementById('telNum').value.trim() || '0120-000-000');
      const telLink = tel.replace(/[^0-9]/g, '');
      const line = escapeHtml(document.getElementById('lineUrl').value.trim() || 'https://line.me');

      const themeKey = document.querySelector('input[name="themeColor"]:checked').value;
      const colors = colorPalettes[themeKey];

      const staffName = escapeHtml(document.getElementById('staffName').value.trim() || '店長・女性スタッフ一同');
      const staffMsg = escapeHtml(document.getElementById('staffMsg').value.trim() || '身だしなみのチェック、靴下の履き替え、丁寧な言葉遣いと笑顔でのご対応を徹底しております。');

      // 料金メニューの構築
      let priceRowsHtml = '';
      for (let i = 1; i <= 5; i++) {
        const mName = document.getElementById(`menu${i}_name`).value.trim();
        const mPrice = document.getElementById(`menu${i}_price`).value.trim();
        if (mName !== '') {
          priceRowsHtml += `
        <div class="service-row">
          <span class="service-name">${escapeHtml(mName)}</span>
          <span class="service-price">${escapeHtml(mPrice)}</span>
        </div>`;
        }
      }

      // ビフォーアフター事例
      const ba1_title = escapeHtml(document.getElementById('ba1_title').value.trim());
      const ba1_desc = escapeHtml(document.getElementById('ba1_desc').value.trim());
      const ba1_time = escapeHtml(document.getElementById('ba1_time').value.trim());
      const ba1_cost = escapeHtml(document.getElementById('ba1_cost').value.trim());

      const ba2_title = escapeHtml(document.getElementById('ba2_title').value.trim());
      const ba2_desc = escapeHtml(document.getElementById('ba2_desc').value.trim());
      const ba2_time = escapeHtml(document.getElementById('ba2_time').value.trim());
      const ba2_cost = escapeHtml(document.getElementById('ba2_cost').value.trim());

      // お客様の声
      const v1_badge = escapeHtml(document.getElementById('v1_badge').value.trim());
      const v1_title = escapeHtml(document.getElementById('v1_title').value.trim());
      const v1_text = escapeHtml(document.getElementById('v1_text').value.trim());

      const v2_badge = escapeHtml(document.getElementById('v2_badge').value.trim());
      const v2_title = escapeHtml(document.getElementById('v2_title').value.trim());
      const v2_text = escapeHtml(document.getElementById('v2_text').value.trim());

      const v3_badge = escapeHtml(document.getElementById('v3_badge').value.trim());
      const v3_title = escapeHtml(document.getElementById('v3_title').value.trim());
      const v3_text = escapeHtml(document.getElementById('v3_text').value.trim());

      // 画像プレースホルダーHTMLのヘルパー
      function renderImage(base64Data, placeholderClass, defaultText) {
        if (base64Data) {
          return `<img src="${base64Data}" alt="Uploaded Image" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;">`;
        }
        return `<div class="img-placeholder ${placeholderClass}">${defaultText}</div>`;
      }

      return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${name} | 女性・シニアも安心の地域密着サポート</title>
  <style>
    :root {
      --bg-base: ${colors.bgBase};
      --bg-card: #ffffff;
      --primary: ${colors.primary};
      --primary-dark: ${colors.primaryDark};
      --primary-light: ${colors.primaryLight};
      --line-green: #06c755;
      --accent-red: #e55353;
      --text-main: #2d2d2d;
      --text-sub: #666666;
      --border-color: #f0eae1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      color: var(--text-main);
      background-color: var(--bg-base);
      line-height: 1.6;
      padding-bottom: 75px;
    }

    /* 画像プレースホルダーCSSクラス定義 */
    .img-placeholder {
      background-color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-weight: bold;
      font-size: 0.85rem;

    // プレビューの即時更新
    function updatePreview() {
      const iframe = document.getElementById('preview-frame');
      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(generateLP());
      doc.close();
    }

    // index.htmlの直接保存
    function downloadLP() {
      const htmlContent = generateLP();
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // フォーム入力変更のリアルタイム検知
    document.querySelectorAll('#editor-form input:not([type="file"]), #editor-form textarea').forEach(element => {
      element.addEventListener('input', updatePreview);
      element.addEventListener('change', updatePreview);
    });

    // 初期化実行
    window.addEventListener('DOMContentLoaded', updatePreview);
  </script>
